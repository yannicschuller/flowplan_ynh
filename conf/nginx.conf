location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # YunoHost's SSOwat removes every Ynh-* header a browser sends and sets
  # these for whoever is logged in on the portal; Flowplan signs them in
  # (AUTH_PROXY_* in the app's environment file).
  proxy_set_header Ynh-User $http_ynh_user;
  proxy_set_header Ynh-User-Email $http_ynh_user_email;
  proxy_set_header Ynh-User-Fullname $http_ynh_user_fullname;

  # Live editing and cursors use server-sent events: no buffering.
  proxy_buffering off;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  # Content archives and imports can be large.
  client_max_body_size 2g;

  # Include SSOWAT user panel's shortcut tile.
  include conf.d/yunohost_panel.conf.inc;
}
